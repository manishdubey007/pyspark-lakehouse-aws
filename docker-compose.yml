services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init container: creates the lakehouse buckets, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/bronze &&
      mc mb --ignore-existing local/silver &&
      mc mb --ignore-existing local/gold
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  spark:
    build: .
    image: pyspark-lakehouse-spark:3.4.0
    container_name: spark
    user: root
    ports:
      - "127.0.0.1:8888:8888"   # JupyterLab (see run.md)
      - "127.0.0.1:4040:4040"   # Spark UI of the running session
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      PATH: /opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Fixed token so the notebook URL is stable across restarts. Port is bound
      # to 127.0.0.1 only; override in .env if you like.
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-lakehouse}
    volumes:
      - ./src:/opt/app/src
      - ./data:/opt/app/data
      - ./tests:/opt/app/tests
      - ./notebooks:/opt/app/notebooks
      - ./config/log4j2.properties:/opt/spark/conf/log4j2.properties
      - ./scripts/spark_entrypoint.sh:/opt/app/scripts/spark_entrypoint.sh
      - spark-ivy-cache:/root/.ivy2
    working_dir: /opt/app
    # Resolves py4j's exact filename at startup instead of a hardcoded
    # version in PYTHONPATH -- see scripts/spark_entrypoint.sh.
    entrypoint: ["/opt/app/scripts/spark_entrypoint.sh"]
    # JupyterLab is the long-running process: it keeps the container alive for
    # `docker compose exec spark ...` and serves the exploration notebooks.
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--allow-root", "--no-browser",
              "--notebook-dir=/opt/app/notebooks"]

volumes:
  minio-data:
  spark-ivy-cache:
